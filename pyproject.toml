[project]
name = "zdem-model-editor"
version = "0.1.0"
description = "tkinter + matplotlib 的 ZDEM 模型文件编辑器"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Phoenix0531-sudo" }]
dependencies = [
    "matplotlib>=3.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zdem_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
# Test/ holds ZDEM DSL sample scripts (shear*.py etc.) that are not Python.
exclude = ["Test", "docs", ".venv", "scripts"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
