name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - run: pip install -r requirements.txt
      - name: Compile Python sources
        run: |
          python -m py_compile main.py scripts/docker_smoke_test.py
          python -m compileall zdem_editor
          python -m py_compile Test/test_enhanced_parser.py Test/test_prop_p4.py
      - name: Import smoke test
        run: python scripts/docker_smoke_test.py || true
